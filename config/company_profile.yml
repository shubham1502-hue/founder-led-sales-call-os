product_name: "Founder-Led Sales Call OS"
target_customer: "Early-stage B2B founders and founder's office operators turning post-call notes into sales learning."
value_proposition: "Convert messy sales call notes into structured objections, deal risks, rescue actions, and weekly GTM narrative experiments without a paid API."

primary_use_cases:
  - "Post-call intelligence after founder-led discovery and demo calls"
  - "Weekly GTM learning review"
  - "Deal rescue prioritization"
  - "Objection and narrative gap tracking"
  - "Founder follow-up planning"

target_industries:
  - "B2B SaaS"
  - "AI SaaS"
  - "Fintech"
  - "Healthtech"
  - "RevOps"
  - "Operations software"
  - "Founder-led services"
  - "Marketplace operations"
  - "Legaltech"

target_company_stages:
  - "Pre-seed"
  - "Seed"
  - "Series A"
  - "Bootstrapped"
  - "Growth"

strong_fit_signals:
  - "founder is still leading sales"
  - "call notes are scattered"
  - "crm notes are incomplete"
  - "follow-ups are slipping"
  - "objections repeat across calls"
  - "weekly sales learning is manual"
  - "team needs deal rescue visibility"
  - "sales narrative is changing quickly"
  - "multiple stakeholders are giving mixed feedback"
  - "prospects ask for proof points"

weak_fit_signals:
  - "no repeatable sales motion yet"
  - "only one or two calls per month"
  - "no CRM or call note habit"
  - "wants cold outreach automation"
  - "outbound leads"
  - "only needs account research"
  - "account research"
  - "before outreach"
  - "no real call notes"
  - "maybe two sales calls"
  - "one large deal per quarter"
  - "low volume"
  - "cheaper spreadsheet template"
  - "does not run weekly GTM review"

disqualifiers:
  - "consumer app"
  - "no sales calls"
  - "pure ecommerce"
  - "student project"
  - "no founder involvement"
  - "only wants lead scraping"

