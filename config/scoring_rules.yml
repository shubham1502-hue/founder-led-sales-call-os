    - "board meeting"
  medium_keywords:
    - "friction"
    - "messy"
    - "inconsistent"
    - "hard to track"
    - "takes time"
    - "needs visibility"
  low_keywords:
    - "curious"
    - "nice to have"
    - "exploring"
    - "someday"

budget_signal:
  high_keywords:
    - "approved budget"
    - "budget allocated"
    - "can pay"
    - "paid pilot"
    - "vendor budget"
  medium_keywords:
    - "budget if"
    - "can find budget"
    - "depends on roi"
    - "pilot budget"
  low_keywords:
    - "no budget"
    - "budget is tight"
    - "unfunded"
    - "after fundraising"

follow_up_clarity:
