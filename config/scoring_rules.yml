    - "schedule"
    - "booked"
    - "book"
    - "send contract"
    - "send roi proof"
    - "send security"
    - "send sample"
    - "technical review"
    - "pilot start"
    - "intro to"
    - "founder intro"
    - "next call"
    - "rescue session"
  vague_next_step_keywords:
