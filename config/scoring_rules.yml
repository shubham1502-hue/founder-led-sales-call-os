score_boundaries:
  strong_fit_min: 75
  medium_fit_min: 50

icp_fit:
  weights:
    target_industry: 15
    target_stage: 15
    employee_count_fit: 10
    decision_maker_contact: 10
    strong_fit_signal: 25
    pain_relevance: 15
    weak_fit_penalty: -15
    disqualifier_penalty: -35
  employee_count:
    min: 5
    max: 250

