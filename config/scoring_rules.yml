  narrative_gap_penalty_per_signal: 10

implementation_risk:
  keywords:
    - "implementation"
    - "migration"
    - "integration"
    - "security review"
    - "legal review"
    - "no bandwidth"
    - "ops team is stretched"

deal_rescue_priority:
  high_min_score: 82
  medium_min_score: 50
  weights:
    icp_fit_score: 0.25
    pain_intensity_score: 0.20
    urgency_score: 0.15
    budget_score: 0.10
    unresolved_objection_risk: 15
    unclear_next_step_risk: 15
    competitor_risk: 8
    pitch_confusion_risk: 8
    implementation_risk_penalty: 6
