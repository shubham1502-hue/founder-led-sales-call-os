[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "founder-led-sales-call-os"
version = "0.1.0"
description = "Post-call intelligence system for founder-led sales conversations."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Shubham Singh"}]
dependencies = [
  "pandas>=2.0,<3.0",
  "PyYAML>=6.0,<7.0",
  "typer>=0.12,<1.0",
  "rich>=13.0,<15.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0"
]

[project.scripts]
founder-sales-os = "founder_sales_os.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
